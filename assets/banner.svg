<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Lead Loop - one Claude Code session runs a multi-day engineering program</title>
  <desc id="d">Beige banner with a blue block holding a square loop diagram and the words Lead Loop.</desc>
  <rect width="1280" height="400" fill="#EAE4D8"/>
  <!-- blue block with the loop glyph -->
  <rect x="0" y="0" width="400" height="400" fill="#0B71B2"/>
  <g fill="none" stroke="#EAE4D8" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M112 128 H288 V272 H112 V186"/>
  </g>
  <polygon points="112,146 88,190 136,190" fill="#EAE4D8"/>
  <g fill="#EAE4D8">
    <rect x="272" y="112" width="34" height="34"/>
    <rect x="272" y="254" width="34" height="34"/>
    <rect x="94" y="254" width="34" height="34"/>
  </g>
  <g fill="#0E0E10">
    <rect x="280" y="120" width="18" height="18"/>
    <rect x="280" y="262" width="18" height="18"/>
    <rect x="102" y="262" width="18" height="18"/>
  </g>
  <text x="200" y="352" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#EAE4D8" letter-spacing="2">BRIEF  BUILD  VERIFY</text>
  <!-- thick rules -->
  <rect x="400" y="0" width="880" height="10" fill="#0E0E10"/>
  <rect x="400" y="390" width="880" height="10" fill="#0E0E10"/>
  <!-- text -->
  <text x="450" y="84" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#085B8F" letter-spacing="4">CLAUDE CODE SKILL</text>
  <text x="446" y="206" font-family="Assistant, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="132" fill="#0E0E10" textLength="780" lengthAdjust="spacingAndGlyphs">LEAD LOOP</text>
  <text x="450" y="262" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#0E0E10">One session. Many builders.</text>
  <text x="450" y="302" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#0E0E10">Evidence, not claims.</text>
  <text x="450" y="364" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#57534B">by Tomer Ezri  /  MIT  /  github.com/FuzulsFriend</text>
</svg>
